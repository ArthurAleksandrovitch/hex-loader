name: CI/CD Hex Loader

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o hex-loader .
