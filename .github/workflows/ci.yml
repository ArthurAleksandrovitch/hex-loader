
name: CI/CD Hex Loader

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build Linux x64
        run: go build -o hex-loader-linux-x64 .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-loader-linux-x64
          path: hex-loader-linux-x64

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Export Go path for MSYS2
        shell: pwsh
        run: |
          $goRoot = (go env GOROOT) -replace '\\', '/'
          "GOROOT_MSYS=$goRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install MSYS2 toolchain and GLFW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glfw
      - name: Verify GCC installation
        shell: msys2 {0}
        run: |
          which gcc
          gcc --version
          which pkg-config

      - name: Check formatting
        shell: pwsh
        run: |
          go version
          $gofmt = (Get-Command gofmt).Source
          Write-Host "gofmt path: $gofmt"
          & $gofmt -h 2>&1 | Select-Object -First 2
          Write-Host "Files requiring gofmt:"
          & $gofmt -l .
          Write-Host "main.go formatting diff:"
          & $gofmt -d main.go
          exit 0

      - name: Build Windows x64
        shell: msys2 {0}
        run: |
          export GOROOT="$(cygpath -u "$GOROOT_MSYS")"
          export PATH="$GOROOT/bin:$PATH"
          export CGO_ENABLED=1
          export CC=gcc
          export PKG_CONFIG=/ucrt64/bin/pkg-config
          go version
          which gcc
          gcc --version
          go build -o hex-loader-windows-x64.exe .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-loader-windows-x64
          path: hex-loader-windows-x64.exe

  build-macos:
    runs-on: macos-15-xlarge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build macOS ARM64
        run: go build -o hex-loader-macos-arm64 .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-loader-macos-arm64
          path: hex-loader-macos-arm64

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/hex-loader-linux-x64/hex-loader-linux-x64
            release-files/hex-loader-windows-x64/hex-loader-windows-x64.exe
            release-files/hex-loader-macos-arm64/hex-loader-macos-arm64
